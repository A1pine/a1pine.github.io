[package]
name = "arcademic-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
build = "build.rs"

[dependencies]
dioxus = { version = "=0.7.3", features = ["fullstack", "router"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
url = "2.5"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

