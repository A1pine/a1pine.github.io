name: Update Publications

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Fetch publications from Google Scholar
        env:
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID || secrets.SCHOLAR_ID }}
        run: node scripts/fetch-publications.mjs "$SCHOLAR_ID"

      - name: Commit updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/publications.json
          if git diff --quiet --cached -- config/publications.json; then
            echo "Publications are already current."
          else
            git commit -m "chore: sync publications from Google Scholar"
            git push
          fi
