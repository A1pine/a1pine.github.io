name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@5aafaaca52423a22d83a812fa3ca77492e2895db
        with:
          version: 1.16.3

      - name: Install pinned Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.3 --locked --no-confirm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify Rust code
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
          cargo check --target wasm32-unknown-unknown --no-default-features --features web --locked

      - name: Build pre-rendered site
        env:
          BASE_PATH: ${{ github.event.repository.name }}
          DIOXUS_CLI: /home/runner/.cargo/bin/dx
        run: scripts/build-pages.sh "$BASE_PATH" release

      - name: Prepare Pages artifact
        run: node scripts/verify-pages-artifact.mjs dist/public "${{ github.event.repository.name }}"

      - name: Verify release artifact in browsers
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3200/${{ github.event.repository.name }}/
        run: |
          node scripts/serve-pages.mjs dist/public 3200 "${{ github.event.repository.name }}" &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused "$PLAYWRIGHT_BASE_URL"
          npm run test:e2e -- --project=chromium --project=firefox --project=webkit

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
