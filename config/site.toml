bio = "Xuning Tan earned his Bachelor of Advanced Computing (Honours) from the Australian National University in 2022. He is currently a PhD student in the joint program between The Chinese University of Hong Kong, Shenzhen (CUHK-Shenzhen) and the Shenzhen Loop Area Institute (SLAI), advised by Prof. Junhua Zhao and Prof. Jianwei Huang. Before beginning his doctoral studies, he spent three years at NetEase Games in Guangzhou. His research applies artificial intelligence to scientific and engineering problems, with a particular focus on energy systems. His core interests include multi-agent systems, trustworthy and explainable AI, and quantum agents."
